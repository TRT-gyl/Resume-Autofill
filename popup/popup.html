<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历自动填充</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 内联 SVG 图标库（Lucide 风格线性图标，扁平现代） -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4"/><circle cx="8" cy="13" r="1"/><circle cx="16" cy="13" r="1"/><path d="M2 12v4"/><path d="M22 12v4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-grad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></symbol>
    <symbol id="i-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></symbol>
    <symbol id="i-rocket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
  </svg>

  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-logo"><img src="../icons/icon48.png" alt="简历自动填充 Logo"></span>
        <h1>简历自动填充</h1>
      </div>
      <!-- 保存成功等全局提示：显示在标题行右侧 -->
      <div id="save-status" class="status"></div>
    </header>

    <!-- 简历导入 / 导出 / AI 模型 / 增强设置 -->
    <div class="io-section">
      <div class="io-import-row" role="toolbar" aria-label="简历、推荐与投递操作">
        <button id="btn-import-json" class="btn-io btn-io-import" aria-label="导入 JSON 简历" data-tooltip="导入 JSON" title="从 JSON 文件导入简历"><svg class="btn-icon"><use href="#i-code"/></svg></button>
        <button id="btn-pdf" class="btn-io btn-io-import" aria-label="导入 PDF 简历" data-tooltip="导入 PDF" title="从 PDF 简历导入"><svg class="btn-icon"><use href="#i-download"/></svg></button>
        <button id="btn-html" class="btn-io btn-io-import" aria-label="导入 HTML 简历" data-tooltip="导入 HTML" title="从 HTML 简历导入"><svg class="btn-icon"><use href="#i-file"/></svg></button>
        <button id="btn-export-json" class="btn-io btn-io-export io-group-start" aria-label="导出 JSON 简历" data-tooltip="导出 JSON" title="导出个人简历为 JSON"><svg class="btn-icon"><use href="#i-upload"/></svg></button>
        <button id="btn-export-html" class="btn-io btn-io-export" aria-label="导出 HTML 简历" data-tooltip="导出 HTML" title="导出个人简历为 HTML（仿中国电信招聘简历版式）"><svg class="btn-icon"><use href="#i-file"/></svg></button>
        <button id="btn-open-recommend" class="btn-io btn-io-recommend io-group-start" aria-label="打开输入框自动推荐" data-tooltip="自动推荐" title="在当前网页打开输入框自动推荐功能"><svg class="btn-icon"><use href="#i-sparkles"/></svg></button>
        <button id="btn-llm" class="btn-io btn-io-llm io-group-start" aria-label="AI 模型设置" data-tooltip="AI 模型" title="展开/收起 AI 模型设置"><svg class="btn-icon"><use href="#i-bot"/></svg></button>
        <button id="btn-record-current" class="btn-io btn-io-record io-group-start" aria-label="记录当前职位" data-tooltip="记录当前职位" title="根据当前职位页面新建投递记录"><svg class="btn-icon"><use href="#i-briefcase"/></svg></button>
        <button id="btn-records" class="btn-io btn-io-record" aria-label="管理投递记录" data-tooltip="投递记录" title="查看和管理投递记录"><svg class="btn-icon"><use href="#i-clipboard"/></svg></button>
        <button id="btn-enhancements" type="button" class="btn-io btn-io-settings io-group-start" aria-label="增强设置、网站规则与简历恢复" data-tooltip="增强设置" title="增强设置 · 网站规则 · 简历恢复"><svg class="btn-icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
      </div>
      <input type="file" id="pdf-input" accept=".pdf" style="display:none">
      <input type="file" id="html-input" accept=".html,.htm" style="display:none">
      <div id="pdf-status" class="status"></div>

      <!-- AI 模型设置（点击上方 AI 模型按钮展开） -->
      <div id="llm-panel" class="llm-panel" style="display:none">
        <div class="field">
          <label>API Base URL</label>
          <input type="text" id="llm-baseUrl" placeholder="https://api.openai.com/v1">
        </div>
        <div class="field">
          <label>API Key</label>
          <input type="password" id="llm-apiKey" placeholder="sk-...">
        </div>
        <div class="field">
          <label>模型名称</label>
          <input type="text" id="llm-model" placeholder="gpt-4o-mini">
        </div>
        <button id="btn-test-llm" class="btn-secondary btn-test"><svg class="btn-icon"><use href="#i-link"/></svg><span id="btn-test-llm-label">测试连接</span></button>
        <div id="llm-test-status" class="status"></div>
      </div>
    </div>

    <!-- 基本信息 -->
    <details class="section">
      <summary><svg class="sec-icon icon-user"><use href="#i-user"/></svg>基本信息</summary>
      <div class="section-content">
        <div class="photo-row">
          <div class="field photo-block">
            <label>证件照</label>
            <div class="photo-upload">
              <div class="photo-preview" id="photo-preview">
                <svg class="photo-icon"><use href="#i-camera"/></svg>
                <span class="photo-hint">上传证件照</span>
              </div>
              <div class="photo-actions">
                <button type="button" id="btn-photo-upload" class="btn-secondary btn-photo">上传照片</button>
                <button type="button" id="btn-photo-remove" class="btn-secondary btn-photo btn-photo-remove" style="display:none">移除</button>
                <input type="file" id="photo-input" accept="image/*" style="display:none">
                <input type="hidden" id="basic-photo">
              </div>
            </div>
          </div>
          <div class="photo-fields">
            <div class="field"><label>姓名</label><input type="text" id="basic-name"></div>
            <div class="field"><label>英文名</label><input type="text" id="basic-englishName" placeholder="选填"></div>
            <div class="field"><label>性别</label><input type="text" id="basic-gender" placeholder="男/女"></div>
            <div class="field"><label>出生日期</label><input type="date" id="basic-birthday"></div>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>证件类型</label>
            <select id="basic-idType">
              <option value="">请选择</option>
              <option value="身份证">身份证</option>
              <option value="护照">护照</option>
              <option value="军官证">军官证</option>
              <option value="港澳居民来往内地通行证">港澳居民来往内地通行证</option>
              <option value="台湾居民来往大陆通行证">台湾居民来往大陆通行证</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>手机号</label><input type="tel" id="basic-phone"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>邮箱</label><input type="email" id="basic-email"></div>
          <div class="field"><label>身份证号</label><input type="text" id="basic-idCard" placeholder="选填"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>所在城市</label><input type="text" id="basic-location" placeholder="现居住地"></div>
          <div class="field"><label>户籍所在地</label><input type="text" id="basic-hukou" placeholder="如：广东深圳"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>籍贯</label><input type="text" id="basic-nativePlace" placeholder="如：湖南长沙"></div>
          <div class="field"><label>民族</label><input type="text" id="basic-ethnicity" placeholder="如：汉族"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>国籍</label><input type="text" id="basic-nationality" placeholder="如：中国"></div>
          <div class="field"><label>户口类型</label>
            <select id="basic-hukouType">
              <option value="">请选择</option>
              <option value="个人户口">个人户口</option>
              <option value="高校集体户口">高校集体户口</option>
              <option value="其他类集体户">其他类集体户</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>政治面貌</label>
            <select id="basic-political">
              <option value="">请选择</option>
              <option value="群众">群众</option>
              <option value="共青团员">共青团员</option>
              <option value="中共党员">中共党员</option>
              <option value="中共预备党员">中共预备党员</option>
              <option value="民主党派">民主党派</option>
            </select>
          </div>
          <div class="field"><label>婚姻状况</label>
            <select id="basic-marital">
              <option value="">请选择</option>
              <option value="未婚">未婚</option>
              <option value="已婚">已婚</option>
              <option value="离异">离异</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>入党团时间</label><input type="date" id="basic-joinPartyDate"></div>
          <div class="field"><label>有无海外留学经历</label>
            <select id="basic-hasOverseas">
              <option value="">请选择</option>
              <option value="否">否</option>
              <option value="是">是</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>工作年限</label><input type="text" id="basic-workYears" placeholder="如：5年"></div>
          <div class="field"><label>到岗时间</label><input type="date" id="basic-availableDate"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>毕业时间</label><input type="date" id="basic-graduationDate"></div>
          <div class="field"><label>是否为应届毕业生</label>
            <select id="basic-freshGraduate">
              <option value="">请选择</option>
              <option value="是">是</option>
              <option value="否">否</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>求职状态</label>
            <select id="basic-jobStatus">
              <option value="">请选择</option>
              <option value="在职-暂不考虑">在职-暂不考虑</option>
              <option value="在职-考虑机会">在职-考虑机会</option>
              <option value="在职-急寻新机会">在职-急寻新机会</option>
              <option value="离职-随时到岗">离职-随时到岗</option>
              <option value="应届毕业生">应届毕业生</option>
            </select>
          </div>
          <div class="field"><label>当前薪资</label><input type="text" id="basic-currentSalary" placeholder="如：15K"></div>
        </div>
        <div class="field"><label>详细地址</label><input type="text" id="basic-address"></div>
        <div class="field-row">
          <div class="field"><label>个人网站 / GitHub</label><input type="url" id="basic-website" placeholder="个人网站或 GitHub 链接"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>微信号</label><input type="text" id="basic-wechat"></div>
          <div class="field"><label>身高(cm)</label><input type="text" id="basic-height"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>体重(kg)</label><input type="text" id="basic-weight"></div>
          <div class="field"><label>是否为国内号码</label>
            <select id="basic-isDomesticMobile">
              <option value="">请选择</option>
              <option value="是">是</option>
              <option value="否">否</option>
            </select>
          </div>
        </div>
        <div class="field"><label>健康说明</label><input type="text" id="basic-healthDesc" placeholder="如：健康（如有生理缺陷或疾病请说明）"></div>
      </div>
    </details>

    <!-- 教育经历 -->
    <details class="section">
      <summary><svg class="sec-icon icon-grad"><use href="#i-grad"/></svg>教育经历</summary>
      <div class="section-content">
        <div id="education-list"></div>
        <button class="btn-add" id="btn-add-edu">+ 添加教育经历</button>
      </div>
    </details>

    <!-- 实习经历 -->
    <details class="section">
      <summary><svg class="sec-icon icon-briefcase"><use href="#i-briefcase"/></svg>实习经历</summary>
      <div class="section-content">
        <div id="work-list"></div>
        <button class="btn-add" id="btn-add-work">+ 添加实习经历</button>
      </div>
    </details>

    <!-- 项目经历 -->
    <details class="section">
      <summary><svg class="sec-icon icon-rocket"><use href="#i-rocket"/></svg>项目经历</summary>
      <div class="section-content">
        <div id="project-list"></div>
        <button class="btn-add" id="btn-add-project">+ 添加项目经历</button>
      </div>
    </details>

    <!-- 专利发表 -->
    <details class="section">
      <summary><svg class="sec-icon icon-bulb"><use href="#i-bulb"/></svg>专利发表</summary>
      <div class="section-content">
        <div id="patent-list"></div>
        <button class="btn-add" id="btn-add-patent">+ 添加专利</button>
      </div>
    </details>

    <!-- 论文发表 -->
    <details class="section">
      <summary><svg class="sec-icon icon-book"><use href="#i-book"/></svg>论文发表</summary>
      <div class="section-content">
        <div id="paper-list"></div>
        <button class="btn-add" id="btn-add-paper">+ 添加论文</button>
      </div>
    </details>

    <!-- 奖励荣誉 -->
    <details class="section">
      <summary><svg class="sec-icon icon-trophy"><use href="#i-trophy"/></svg>奖励荣誉</summary>
      <div class="section-content">
        <div id="award-list"></div>
        <button class="btn-add" id="btn-add-award">+ 添加奖励</button>
      </div>
    </details>

    <!-- 语言能力与资格证书 -->
    <details class="section">
      <summary><svg class="sec-icon icon-badge"><use href="#i-badge"/></svg>语言能力与资格证书</summary>
      <div class="section-content">
        <div class="field">
          <label>语言能力（大学英语六级/四级等，每条含级别、分数、时间）</label>
          <div id="language-list"></div>
          <button class="btn-add" id="btn-add-language">+ 添加语言能力</button>
        </div>
        <div class="field">
          <label>资格证书（每行一项）</label>
          <textarea id="certificates" rows="3" placeholder="PMP项目管理&#10;软考高级-系统架构师&#10;AWS SAA"></textarea>
        </div>
      </div>
    </details>

    <!-- 校内职务 -->
    <details class="section">
      <summary><svg class="sec-icon icon-campus"><use href="#i-users"/></svg>校内职务</summary>
      <div class="section-content">
        <div id="campus-list"></div>
        <button class="btn-add" id="btn-add-campus">+ 添加校内职务</button>
      </div>
    </details>

    <!-- 家庭关系 -->
    <details class="section">
      <summary><svg class="sec-icon icon-family"><use href="#i-users"/></svg>家庭关系</summary>
      <div class="section-content">
        <div class="family-emergency">
          <div class="family-subtitle">紧急联系人</div>
          <div class="field-row">
            <div class="field"><label>紧急联系人</label><input type="text" id="basic-emergencyName" placeholder="姓名"></div>
            <div class="field"><label>紧急联系电话</label><input type="tel" id="basic-emergencyPhone"></div>
          </div>
          <div class="field"><label>紧急联系人关系</label><input type="text" id="basic-emergencyRelation" placeholder="如：母亲"></div>
        </div>
        <div id="family-list"></div>
        <button class="btn-add" id="btn-add-family">+ 添加家庭成员</button>
      </div>
    </details>

    <!-- 求职意向 -->
    <details class="section">
      <summary><svg class="sec-icon icon-target"><use href="#i-target"/></svg>求职意向</summary>
      <div class="section-content">
        <div class="field-row">
          <div class="field"><label>期望职位</label><input type="text" id="intention-position"></div>
          <div class="field"><label>期望薪资</label><input type="text" id="intention-salary" placeholder="15K-25K"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>期望城市</label><input type="text" id="intention-city"></div>
          <div class="field"><label>期望城市2</label><input type="text" id="intention-city2" placeholder="备选城市"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>期望面试地点</label><input type="text" id="intention-interviewCity" placeholder="如：北京-海淀区"></div>
          <div class="field"><label>调剂工作城市</label><input type="text" id="intention-adjustCity" placeholder="如：陕西省"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>工作类型</label>
            <select id="intention-type">
              <option value="">请选择</option>
              <option value="全职">全职</option>
              <option value="兼职">兼职</option>
              <option value="实习">实习</option>
            </select>
          </div>
          <div class="field"><label>期望行业</label><input type="text" id="intention-industry" placeholder="如：互联网/金融"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>税前月薪最低要求</label><input type="text" id="intention-minSalary" placeholder="如：8000（元/月）"></div>
          <div class="field"><label>是否服从公司调剂</label>
            <select id="intention-obeyAllocate">
              <option value="">请选择</option>
              <option value="是">是</option>
              <option value="否">否</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>目前年薪</label><input type="text" id="intention-currentAnnual" placeholder="如：20W"></div>
          <div class="field"><label>信息渠道</label><input type="text" id="intention-infoChannel" placeholder="如：移动官方招聘网站"></div>
        </div>
      </div>
    </details>

    <!-- 专业技能 -->
    <details class="section">
      <summary><svg class="sec-icon icon-code"><use href="#i-code"/></svg>专业技能</summary>
      <div class="section-content">
        <div class="field">
          <label>技能列表（每行一项，如：JavaScript - 精通）</label>
          <textarea id="skills" rows="5" placeholder="JavaScript - 精通&#10;React - 熟练&#10;Python - 熟练&#10;SQL - 掌握"></textarea>
        </div>
        <div class="field">
          <label>个人爱好（每行一项）</label>
          <textarea id="hobbies" rows="2" placeholder="篮球&#10;摄影"></textarea>
        </div>
      </div>
    </details>

    <!-- 计算机技能 -->
    <details class="section">
      <summary><svg class="sec-icon icon-computer"><use href="#i-clipboard"/></svg>计算机技能</summary>
      <div class="section-content">
        <div id="computer-list"></div>
        <button class="btn-add" id="btn-add-computer">+ 添加计算机技能</button>
      </div>
    </details>

    <!-- 其他补充信息 -->
    <details class="section">
      <summary><svg class="sec-icon icon-extra"><use href="#i-clipboard"/></svg>其他补充信息</summary>
      <div class="section-content">
        <div class="field">
          <label>是否有亲属在单位、集团内任职</label>
          <select id="basic-hasRelativeInCompany">
            <option value="">请选择</option>
            <option value="否">否</option>
            <option value="是">是</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label>是否有运营商实习经验</label>
            <select id="extra-operatorExp">
              <option value="">请选择</option>
              <option value="是">是</option>
              <option value="否">否</option>
            </select>
          </div>
          <div class="field"><label>是否接受岗位调剂</label>
            <select id="extra-jobTransfer">
              <option value="">请选择</option>
              <option value="是">是</option>
              <option value="否">否</option>
            </select>
          </div>
        </div>
        <div class="field"><label>就读院校所在城市</label><input type="text" id="extra-schoolCity" placeholder="如：北京-北京市"></div>
        <div class="field-row">
          <div class="field"><label>职业目标</label><input type="text" id="extra-jobObjective" placeholder="如：在目标领域持续积累专业能力"></div>
        </div>
        <div class="field">
          <label>职业规划（近 5 年，500 字以内）</label>
          <textarea id="extra-careerPlan" rows="4" placeholder="按阶段描述技术深耕、能力延展与价值输出..."></textarea>
        </div>
      </div>
    </details>

    <!-- 自我评价 -->
    <details class="section">
      <summary><svg class="sec-icon icon-sparkles"><use href="#i-sparkles"/></svg>自我评价</summary>
      <div class="section-content">
        <div class="field">
          <label>自我评价</label>
          <textarea id="self-evaluation" rows="5" placeholder="简要描述你的优势和特长..."></textarea>
        </div>
      </div>
    </details>
  </div>

  <!-- JSON 导入弹窗 -->
  <div id="json-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>导入 JSON 数据</h3>
      <textarea id="json-input" rows="10" placeholder="粘贴 JSON 数据..."></textarea>
      <div class="modal-actions">
        <button id="btn-json-confirm" class="btn-primary">确认导入</button>
        <button id="btn-json-cancel" class="btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <!-- PDF 解析结果确认弹窗 -->
  <div id="pdf-confirm-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>PDF 解析结果</h3>
      <p id="pdf-confirm-text">检测到上次未完成的 PDF 解析结果，是否应用到表单？</p>
      <div class="modal-actions">
        <button id="pdf-confirm-confirm" class="btn-primary">应用</button>
        <button id="pdf-confirm-cancel" class="btn-secondary">放弃</button>
      </div>
    </div>
  </div>

  <script src="../lib/pdf.min.js"></script>
  <script src="../records/application-records-core.js"></script>
  <script src="../shared/enhancements-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
